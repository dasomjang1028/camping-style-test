        async function saveTestResultToGoogleSheet(resultData) {

            }

            try {
                // Form을 이용한 데이터 전송 (CORS 회피)
                const success = await sendDataViaForm('save_test_result', {
                    ...resultData,
                    ip_address: await getClientIP()
                });

                } else {
                    throw new Error('Form 전송 실패');
                }
            } catch (error) {
                console.error('구글 시트 저장 실패:', error);
                // 구글 시트 저장 실패 시 로컬 저장으로 폴백

                return { success: false, error: error.message };
            }
        }

        // Form을 이용한 데이터 전송 (CORS 회피)
        async function sendDataViaForm(action, data) {
            return new Promise((resolve) => {
                try {
                    // 숨겨진 iframe 생성
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.name = 'hiddenFrame';
                    document.body.appendChild(iframe);
                    
                    // Form 생성
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = GOOGLE_SCRIPT_URL;
                    form.target = 'hiddenFrame';
                    
                    // 데이터를 input으로 추가
                    const actionInput = document.createElement('input');
                    actionInput.type = 'hidden';
                    actionInput.name = 'action';
                    actionInput.value = action;
                    form.appendChild(actionInput);
                    
                    const dataInput = document.createElement('input');
                    dataInput.type = 'hidden';
                    dataInput.name = 'data';
                    dataInput.value = JSON.stringify(data);
                    form.appendChild(dataInput);
                    
                    // Form 전송
                    document.body.appendChild(form);
                    form.submit();
                    
                    // 정리
                    setTimeout(() => {
                        document.body.removeChild(form);
                        document.body.removeChild(iframe);
                        resolve(true);
                    }, 1000);
                    
                } catch (error) {
                    console.error('Form 전송 오류:', error);
                    resolve(false);
                }
            });
        }

        // 백엔드 서버 API 호출 함수 (기존)
        async function saveTestResultToServer(resultData) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/camping/test-result`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(resultData)
                });
                
                if (!response.ok) {
                    throw new Error('서버 응답 오류');
                }
                
                const result = await response.json();
                console.log('서버에 저장 완료:', result);
                return result;
            } catch (error) {
                console.error('서버 저장 실패:', error);
                return { success: false, error: error.message };
            }
        }

        // 구글 시트 쿠폰 발급
        async function issueCouponFromGoogleSheet(resultType) {
            if (!USE_GOOGLE_SHEETS || !GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('여기에_')) {
                return generateLocalCoupon(resultType);
            }

            try {
                // Form을 이용한 쿠폰 발급 요청
                const success = await sendDataViaForm('issue_coupon', {
                    result_type: resultType,
                    user_agent: navigator.userAgent,
                    ip_address: await getClientIP()
                });
                
                if (success) {
                    console.log('구글 시트에 쿠폰 발급 요청 완료 (Form 전송)');
                }
                
                // 구글 시트에도 전송하고 로컬 쿠폰도 생성 (사용자 경험 향상)
                return generateLocalCoupon(resultType);
            } catch (error) {
                console.error('구글 시트 쿠폰 발급 실패:', error);
                return generateLocalCoupon(resultType);
            }
        }

        // 백엔드 서버 쿠폰 발급 (기존)
        async function issueCouponFromServer(resultType) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/camping/issue-coupon`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        result_type: resultType,
                        user_agent: navigator.userAgent
                    })
                });
                
                if (!response.ok) {
                    throw new Error('서버 응답 오류');
                }
                
                const result = await response.json();
                return result;
            } catch (error) {
                console.error('서버 쿠폰 발급 실패:', error);
                return generateLocalCoupon(resultType);
            }
        }

        // 로컬 쿠폰 생성
        function generateLocalCoupon(resultType) {
            return {
                success: true,
                data: {
                    coupon_code: `CAMPING${Math.random().toString(36).substr(2, 8).toUpperCase()}`,
                    result_type: resultType,
                    timestamp: new Date().toISOString()
                },
                message: '쿠폰이 발급되었습니다! (로컬)',
                fallback: true
            };
        }

        // IP 주소 가져오기 (간단한 방법)
        async function getClientIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.log('IP 조회 실패:', error);
                return 'unknown';
            }
        }

        // 로컬 저장 함수 (서버 실패 시 백업)
        function saveTestResultLocally(resultData) {
            let localData = JSON.parse(localStorage.getItem('campingTestData') || '[]');
            localData.push(resultData);
            localStorage.setItem('campingTestData', JSON.stringify(localData));
            console.log('로컬에 저장됨:', resultData);
        }

        function startTest() {
            document.getElementById('main').classList.remove('active');
            document.getElementById('question').classList.add('active');
            showQuestion();
        }

        function showQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('current-q').textContent = currentQuestion + 1;
            document.getElementById('progress').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('question-text').textContent = question.q;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            question.a.forEach((answer) => {
                const option = document.createElement('div');
                option.className = 'option';
                option.textContent = answer.text;
                option.onclick = () => selectAnswer(answer.type, answer.text);
                optionsDiv.appendChild(option);
            });
        }

        function selectAnswer(type, text) {
            answers[type]++;
            userResponses.push({
                question: questions[currentQuestion].q,
                answer: text,
                type: type
            });
            
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                setTimeout(showQuestion, 300);
            } else {
                setTimeout(showResult, 300);
            }
        }

        function calculateResult() {
            let result = '';
            result += answers.E > answers.I ? 'E' : 'I';
            result += answers.S > answers.N ? 'S' : 'N';
            result += answers.T > answers.F ? 'T' : 'F';
            result += answers.J > answers.P ? 'J' : 'P';
            return result;
        }

        async function showResult() {
            const resultType = calculateResult();
            const result = results[resultType];
            
            document.getElementById('question').classList.remove('active');
            document.getElementById('result').classList.add('active');
            
            document.getElementById('result-emoji').textContent = result.emoji;
            document.getElementById('result-title').textContent = result.title;
            document.getElementById('result-subtitle').textContent = result.subtitle;
            document.getElementById('result-description').textContent = result.description;
            
            // 데이터 저장 (구글 시트 우선, 실패 시 서버/로컬)
            const resultData = {
                result_type: resultType,
                result_title: result.title,
                responses: userResponses,
                user_agent: navigator.userAgent,
                referrer: document.referrer,
                timestamp: new Date().toISOString()
            };
            
            // 구글 시트 -> 서버 -> 로컬 순으로 시도
            if (USE_GOOGLE_SHEETS) {
                await saveTestResultToGoogleSheet(resultData);
            } else {
                const serverResult = await saveTestResultToServer(resultData);
                if (!serverResult.success) {
                    saveTestResultLocally(resultData);
                }
            }
        }

        async function getCoupon() {
            const couponBtn = document.getElementById('coupon-btn');
            const couponResult = document.getElementById('coupon-result');
            
            // 버튼 비활성화 및 로딩 표시
            couponBtn.disabled = true;
            couponBtn.innerHTML = '쿠폰 발급 중<span class="loading"></span>';
            
            try {
                const resultType = calculateResult();
                
                // 구글 시트 우선, 실패 시 서버/로컬
                const couponData = USE_GOOGLE_SHEETS 
                    ? await issueCouponFromGoogleSheet(resultType)
                    : await issueCouponFromServer(resultType);
                
                if (couponData.success) {
                    couponResult.innerHTML = `
                        <div class="alert alert-success">
                            🎉 ${couponData.message}<br>
                            <strong>쿠폰코드: ${couponData.data.coupon_code}</strong><br>
                            <small>* 캠핑용품 쇼핑몰에서 사용하세요</small>
                        </div>
                    `;
                    couponBtn.style.display = 'none';
                } else {
                    throw new Error(couponData.error || '쿠폰 발급 실패');
                }
            } catch (error) {
                couponResult.innerHTML = `
                    <div class="alert alert-error">
                        ❌ 쿠폰 발급에 실패했습니다.<br>
                        <small>${error.message}</small>
                    </div>
                `;
                couponBtn.disabled = false;
                couponBtn.innerHTML = '다시 시도';
            }
        }

        function shareResult() {
            const resultType = calculateResult();
            const result = results[resultType];
            const shareText = `나의 캠핑 스타일: ${result.title}\n${result.subtitle}\n\n테스트 해보기: ${window.location.href}`;
            
            if (navigator.share) {
                navigator.share({
                    title: '나의 캠핑 스타일 테스트',
                    text: shareText
                });
            } else {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareText);
                    alert('결과가 클립보드에 복사되었습니다!');
                } else {
                    alert('공유하기: ' + shareText);
                }
            }
        }

        function restartTest() {
            currentQuestion = 0;
            answers = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            userResponses = [];
            
            document.getElementById('result').classList.remove('active');
            document.getElementById('main').classList.add('active');
            
            // 쿠폰 섹션 초기화
            document.getElementById('coupon-btn').disabled = false;
            document.getElementById('coupon-btn').innerHTML = '쿠폰 받기';
            document.getElementById('coupon-btn').style.display = 'inline-block';
            document.getElementById('coupon-result').innerHTML = '';
        }

        // 개발자용 데이터 조회 함수
        function getCampingTestData() {
            console.log('로컬 저장 데이터:', JSON.parse(localStorage.getItem('campingTestData') || '[]'));
            
            // 구글 시트 통계 조회
            if (USE_GOOGLE_SHEETS && GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes('여기에_')) {
                console.log('📊 구글 시트 연결됨');
                console.log('🔗 구글 시트 직접 확인:', GOOGLE_SCRIPT_URL.replace('/exec', ''));
                console.log('💡 통계 API 테스트:', `${GOOGLE_SCRIPT_URL}?action=stats`);
            } else {
                // 서버 통계 조회 (서버가 구축된 경우)
                fetch(`${API_BASE_URL}/api/camping/stats`)
                    .then(res => res.json())
                    .then(data => {
                        console.log('서버 통계 데이터:', data);
                    })
                    .catch(error => {
                        console.log('서버 통계 조회 실패:', error.message);
                    });
            }
            
            return {
                localData: JSON.parse(localStorage.getItem('campingTestData') || '[]'),
                note: USE_GOOGLE_SHEETS ? '구글 시트 데이터는 콘솔 또는 시트에서 확인하세요' : '서버 데이터는 콘솔에서 확인하세요'
            };
        }

        // 연결 테스트
        async function testConnections() {
            console.log('🔍 연결 상태 확인 중...');
            
            // 구글 시트 연결 테스트
            if (USE_GOOGLE_SHEETS && GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes('여기에_')) {
                console.log('✅ 구글 시트 연결 설정됨');
                console.log('📊 CORS 제한으로 인해 직접 응답 확인 불가');
                console.log('💡 수동 테스트:', `${GOOGLE_SCRIPT_URL}?action=stats`);
                console.log('📝 데이터 전송은 백그라운드에서 진행됩니다');
                return true;
            } else {
                console.log('⚙️ 구글 시트 미설정 - URL을 설정해주세요');
            }
            
            // 백엔드 서버 연결 테스트
            try {
                const response = await fetch(`${API_BASE_URL}/api/camping/stats`);
                if (response.ok) {
                    console.log('✅ 백엔드 서버 연결 성공');
                    return true;
                } else {
                    console.log('❌ 백엔드 서버 연결 실패 - HTTP ' + response.status);
                }
            } catch (error) {
                console.log('❌ 백엔드 서버 연결 실패:', error.message);
            }
            
            console.log('💡 로컬 모드로 동작합니다');
            return false;
        }

        // 기존 함수명 호환성 유지
        const testServerConnection = testConnections;

        // 페이지 로드 시 연결 테스트
        window.addEventListener('load', () => {
            testConnections();
        });
    </script>
</body>
</html>
